<script>
/* ▼ 여기만 수정하세요 ▼ */
const C = {
  groom: "호완", bride: "유진",
  groomFull: "전호완", brideFull: "한유진",
  date: "2027-10-02", time: "10:20", timeLabel: "10시 20분",
  venue: "노비아갈라 동촌점", hall: "5F 포레아홀",
  address: "대구광역시 동구 동촌로 87",
  tel: "1800-1999", /* 예식장 전화번호 (📞 누르면 전화 연결) */
  mapQuery: "노비아갈라 동촌점", /* 지도 앱에서 검색할 이름 */
  greeting: "친구로 시작해 연인이 되고\n6년의 시간을 지나\n이제는 부부가 되려 합니다.\n캠퍼스에서 만난 동갑내기 두 사람의\n새로운 시작을 함께 기뻐해 주세요.\n\n오셔서 자리를 빛내 주시면 감사하겠습니다.",
  parents: [
    ["전성욱 · 박혜원", " 의 차남", "호완"],
    ["한동국 · 서미화", " 의 차녀", "유진"]

  ],
  groomPhoto: "", bridePhoto: "", /* 동그란 프로필 사진 (data: 주소) */
  groomBio: "차분하고 다정한 사람입니다.\n함께 웃는 시간을 가장 좋아해요.",
  brideBio: "호기심 많고 좋아하는 일에 진심인,\n밝고 에너지 넘치는 사람입니다.",
  heroPhoto: "", /* 첫 화면 사진 (data: 주소). 비어 있으면 임시 그라데이션 */

    "신랑측": [["아버지 전성욱", "○○은행 000-000-000000"], ["어머니 박혜원", "○○은행 000-000-000000"], ["신랑 전호완", "○○은행 000-000-000000"]],

};
/* ▲ 여기까지 ▲ */

const $ = id => document.getElementById(id);
const d = new Date(C.date + "T" + C.time + ":00");
const days = ["일","월","화","수","목","금","토"];
const toast = m => { const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); };
const copy = async (txt, msg) => { try { await navigator.clipboard.writeText(txt); toast(msg||"복사했어요"); } catch(e){ toast("복사하지 못했어요. 직접 선택해 주세요"); } };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const pad = n => String(n).padStart(2,"0"), hr = d.getHours();
$("tDate").textContent = `${String(d.getFullYear()).slice(2)}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;

$("tTime").textContent = `${pad(hr)}:${pad(d.getMinutes())}`;
$("bVenue").textContent = `노비아갈라 동촌 ${C.hall}`;
$("hero").style.background = C.heroPhoto ? `center/cover no-repeat url("${C.heroPhoto}")` : "linear-gradient(165deg,#2F4B3A 0%,#6E8F67 55%,#C3D4B2 100%)";

document.title = `${C.groomFull} ♥ ${C.brideFull} 결혼합니다`;
$("greeting").innerHTML = esc(C.greeting).replace(/\n/g,"<br>");
$("parents").innerHTML = C.parents.map(p=>`<div><b>${esc(p[0])}</b>${esc(p[1])} <b>${esc(p[2])}</b></div>`).join("");

const today = new Date(); today.setHours(0,0,0,0);
const target = new Date(d); target.setHours(0,0,0,0);
const diff = Math.round((target-today)/864e5);
$("dday").innerHTML = diff>0 ? `${esc(C.groom)}, ${esc(C.bride)}의 결혼식이 <span class="dd">${diff}일</span> 남았습니다` : diff===0 ? "오늘 결혼합니다" : "함께해 주셔서 감사합니다";

$("calHead").innerHTML = `<div class="cal-date">${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일 ${C.timeLabel}</div><div class="cal-place">노비아갈라 동촌 ${esc(C.hall)}</div><div class="cal-month">${d.getMonth()+1}월</div>`;
const first = new Date(d.getFullYear(), d.getMonth(), 1).getDay();
const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
let h = "<tr>"+days.map((x,i)=>`<th class="${i===0?"sun":""}">${x}</th>`).join("")+"</tr><tr>";
for(let i=0;i<first;i++) h+="<td></td>";
for(let n=1;n<=last;n++){
  const wd=(first+n-1)%7;
  h+=`<td class="${wd===0?"sun":""} ${n===d.getDate()?"on":""}">${n===d.getDate()?`<span>${n}</span>`:n}</td>`;
  if(wd===6 && n<last) h+="</tr><tr>";
}
$("cal").innerHTML = h+"</tr>";

$("gallery").innerHTML = Array.from({length:5},(_,i)=> C.photos[i] ? `<div><img src="${esc(C.photos[i])}" alt="${esc(C.groomFull)}, ${esc(C.brideFull)} 사진 ${i+1}" loading="lazy"></div>` : `<div>사진 ${i+1}</div>`).join("");

$("vName").innerHTML = `${esc(C.venue)}<a class="tel" href="tel:${C.tel.replace(/[^0-9+]/g,"")}" aria-label="예식장에 전화하기"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" style="vertical-align:-3px"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></a>`;
$("vHall").textContent = C.hall;
$("vAddr").textContent = C.address;
const q = encodeURIComponent(C.mapQuery);
$("mapNaver").href = "https://map.naver.com/p/search/" + q;
const tmapUrl = "tmap://search?name=" + encodeURIComponent(C.address);
$("mapTmap").href = tmapUrl;
$("mapTmap").onclick = e => {
  e.preventDefault();
  const t = Date.now();
  location.href = tmapUrl;
  setTimeout(() => {
    if (!document.hidden && Date.now() - t < 2500)
      location.href = /iPhone|iPad/i.test(navigator.userAgent) ? "https://apps.apple.com/kr/app/id431589174" : "https://play.google.com/store/apps/details?id=com.skt.tmap.ku";
  }, 1500);
};
$("mapKakao").href = "https://map.kakao.com/link/search/" + encodeURIComponent(C.address);
let kRendered = false;
$("mapKakao").onclick = e => {
  if (typeof daum === "undefined" || !daum.roughmap) return; /* 지도 스크립트를 못 불러오면 카카오맵 검색 링크로 이동 */
  e.preventDefault();
  const box = document.querySelector(".kmap");
  const open = box.classList.toggle("open");
